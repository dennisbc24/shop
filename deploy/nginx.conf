# /etc/nginx/sites-available/cocinamejor.store  -> ln -s a sites-enabled
# Requiere 2 frontends en misma EC2: inventario (dist en backend) + shop (Next.js :3001)
# Backend API siempre en :3000

# --- Inventario ---
server {
    listen 80;
    server_name inventario.cocinamejor.store;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }
    # Frontend inventario servido por Express (dist estático) en :3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        try_files $uri $uri/ @backend;
    }
    location @backend { proxy_pass http://127.0.0.1:3000; }
}

# --- Shop (cocinamejor.store) ---
server {
    listen 80;
    server_name cocinamejor.store www.cocinamejor.store;

    # Next.js en 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Opcional: si shop llama /api/inventario/* se reescribe a https, pero mejor directo a 3000
}

# HTTPS con certbot:
# sudo certbot --nginx -d inventario.cocinamejor.store -d cocinamejor.store -d www.cocinamejor.store
