name: Deploy shop to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (git pull)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            echo "==> Detectar carpeta shop (soporta ~/shop y ~/proyects/shop)"
            echo "HOME=$HOME USER=$(whoami) PWD=$(pwd)"
            ls -ld "$HOME/shop" "$HOME/proyects/shop" 2>&1 || true
            APP_DIR="$HOME/proyects/shop"
            # fallback si lo moviste a ~/shop
            if [ ! -d "$APP_DIR/.git" ] && [ -d "$HOME/shop/.git" ]; then APP_DIR="$HOME/shop"; fi
            # Si usas secret APP_DIR, descomenta:
            # APP_DIR="${{ secrets.APP_DIR }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: no se encontró git en $APP_DIR ni $HOME/proyects/shop"
              echo "Haz: git clone https://github.com/dennisbc24/shop.git \$HOME/shop"
              echo "O ajusta APP_DIR en deploy.yml a tu ruta real"
              ls -la "$HOME" 2>&1 | head -20
              exit 1
            fi
            echo "Usando APP_DIR=$APP_DIR"
            cd "$APP_DIR"
            echo "==> Forzar remote HTTPS (evita Permission denied publickey)"
            git remote set-url origin https://github.com/dennisbc24/shop.git
            # Si repo es privado, usa PAT: descomenta siguiente linea y añade secret GH_PAT
            # git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/dennisbc24/shop.git
            echo "==> Git pull"
            git fetch origin main
            git reset --hard origin/main
            echo "==> .env"
            if [ ! -f .env.local ]; then
              cat > .env.local <<EOF
            NEXT_PUBLIC_API_URL=https://inventario.cocinamejor.store/api/v1/public
            EOF
            fi
            echo "==> Install & Build"
            npm ci
            npm run build
            echo "==> PM2"
            if pm2 list | grep -q "shop"; then
              pm2 reload ecosystem.config.js --only shop --update-env
            else
              pm2 start ecosystem.config.js --only shop
            fi
            pm2 save
            pm2 ls
            echo "==> Deploy OK - $(date) - $(git rev-parse --short HEAD)"
