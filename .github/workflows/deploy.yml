name: Deploy shop to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shop
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (en el runner, NO en la EC2)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://inventario.cocinamejor.store/api/v1/public' }}
          NEXT_PUBLIC_SHOP_URL: ${{ vars.NEXT_PUBLIC_SHOP_URL || 'https://cocinamejor.store' }}

      - name: Package standalone release
        run: |
          set -euo pipefail
          rm -rf release release.tar.gz
          mkdir -p release
          cp -a .next/standalone/. release/
          mkdir -p release/.next
          cp -a .next/static release/.next/static
          cp -a public release/public
          tar -czf release.tar.gz -C release .
          du -sh release.tar.gz

      - name: Upload release to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: release.tar.gz
          target: /tmp

      - name: Activate release (sin build en la EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="$HOME/proyects/shop"
            if [ ! -d "$APP_DIR/.git" ] && [ -d "$HOME/shop/.git" ]; then APP_DIR="$HOME/shop"; fi
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: no se encontro git en $HOME/proyects/shop ni $HOME/shop"
              exit 1
            fi
            echo "==> APP_DIR=$APP_DIR"
            cd "$APP_DIR"
            git remote set-url origin https://github.com/dennisbc24/shop.git
            git fetch origin main
            git reset --hard origin/main
            bash deploy/activate-release.sh /tmp/release.tar.gz "$APP_DIR"
            rm -f /tmp/release.tar.gz
